<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReSume</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #FAFBFD;
      color: #1A1D2E;
      width: 280px;
      min-height: 200px;
    }

    /* Header */
    .header {
      background: #4F6EF7;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      width: 28px; height: 28px;
      background: rgba(255,255,255,0.2);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 800; color: white;
    }
    .header-title { font-size: 15px; font-weight: 700; color: white; }
    .header-sub   { font-size: 11px; color: rgba(255,255,255,0.7); margin-top: 1px; }

    /* Status badge */
    .status-row {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid #E5E7EB;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #9CA3AF;
      flex-shrink: 0;
    }
    .dot.connected    { background: #22C55E; }
    .dot.disconnected { background: #EF4444; animation: pulse 1.5s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }
    #statusText {
      font-size: 12px;
      color: #6B7280;
    }

    /* Actions */
    .actions { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 8px; }

    button {
      width: 100%;
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, background 0.15s;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    button:disabled { opacity: 0.45; cursor: default; }

    #saveBtn {
      background: #4F6EF7;
      color: white;
    }
    #saveBtn:not(:disabled):hover { background: #3A56D4; }

    /* Info row */
    .info {
      font-size: 11px;
      color: #9CA3AF;
      text-align: center;
      padding: 0 16px 14px;
      line-height: 1.5;
    }

    /* Spinner */
    .spinner {
      display: none;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading .spinner { display: inline-block; }
    .loading .btn-label { display: none; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">R</div>
    <div>
      <div class="header-title">ReSume</div>
      <div class="header-sub">Session Helper</div>
    </div>
  </div>

  <div class="status-row">
    <div class="dot" id="dot"></div>
    <span id="statusText">Checking connection…</span>
  </div>

  <div class="actions">
    <button id="saveBtn" disabled>
      <span class="spinner"></span>
      <span class="btn-label">💾&nbsp;&nbsp;Save Session Now</span>
    </button>
  </div>

  <div class="info" id="infoText">
    Opens ReSume and captures all tabs.
  </div>

  <script src="popup.js"></script>
</body>
</html>
